[project]
name = "thermio-gateway"
version = "0.1.0"
description = "thermio BACnet/IP 软采集服务（Python，ADR-001/016）：点位发现/点表导出、轮询采集、MQTT 上行（伪装成品网关）、断网缓存补传、下行面（config/read/write/offline_action）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "bacpypes3==0.0.110",
    "paho-mqtt==2.1.0",
    "openpyxl==3.1.5",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
thermio-gateway = "thermio_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermio_gateway"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # import order
    "UP",               # pyupgrade
    "B",                # bugbear（含 BLE 裸 except 纪律的近邻）
    "SIM",              # simplify
    "RUF",
]
ignore = [
    "E501",   # 行宽交给 formatter；超长注释/URL 放行（lint 层不重复罚）
    # 中文注释/docstring 全角标点是本仓既定书写风格（注释语言随项目主语言）
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# tests：简化分支结构容让（SIM117 等），行为断言密度优先
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["thermio_gateway"]
# bacpypes3/paho-mqtt 无类型存根：第三方容缺（PY-01 对自家代码仍全量注解）
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# e2e（需真实 EMQX，scripts/e2e.sh 自起隔离栈驱动）不进默认收集
addopts = "--ignore=tests/e2e"
markers = [
    "e2e: 端到端主链（scripts/e2e.sh 驱动，需隔离 compose 栈）",
]
